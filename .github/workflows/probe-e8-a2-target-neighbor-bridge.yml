name: probe-e8-a2-target-neighbor-bridge

on:
  push:
    branches:
      - codex/rank32-research
    paths:
      - "research/search_e8_a2_target_neighbor_bridge.py"
      - "research/sample_projective_lines.py"
      - "research/import_e8_a2_target_neighbor_bridge_artifact.py"
      - "research/certify_e8_a2_shimura_bridge.py"
      - "tests/test_e8_a2_target_neighbor_bridge.py"
      - "tests/test_projective_line_sampler.py"
      - "tests/test_import_e8_a2_target_neighbor_bridge_artifact.py"
      - ".github/workflows/probe-e8-a2-target-neighbor-bridge.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Search only from E8+A2^3 or bidirectionally from both endpoints
        required: true
        type: choice
        default: bidirectional
        options:
          - bidirectional
          - forward
      rounds:
        description: Exact bounded beam rounds
        required: true
        default: "8"
      beam_size:
        description: States retained after each side's sequential expansion
        required: true
        default: "8"
      primes:
        description: Comma-separated p-neighbor primes
        required: true
        default: "2"
      line_offset:
        description: Accepted lines skipped in the selected deterministic ordering
        required: true
        default: "0"
      lines_per_prime:
        description: Projective isotropic lines constructed per state and prime
        required: true
        default: "32"
      max_successful_moves:
        description: Hard bound on serialized successful neighbor constructions
        required: true
        default: "10000"
      max_isometry_checks:
        description: Hard bound on PARI qfisom calls; identical Grams are outside it
        required: true
        default: "20000"
      line_selection:
        description: Deterministic full-coordinate sample or historical Sage ordering
        required: true
        type: choice
        default: hash-projective
        options:
          - hash-projective
          - lexicographic
      sampling_seed:
        description: Portable deterministic seed; at most 4096 raw draws per window
        required: true
        default: rank32-20260908-p2-v1

permissions:
  contents: read

jobs:
  exact-neighbor-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: sagemath/sagemath:10.9@sha256:e068670ae5863b54b2550e72437ec637b0283acb0dc712c8584c124dbf44e667
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Resolve bounded defaults for push and manual inputs
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ROUNDS: ${{ inputs.rounds }}
          INPUT_BEAM_SIZE: ${{ inputs.beam_size }}
          INPUT_PRIMES: ${{ inputs.primes }}
          INPUT_LINE_OFFSET: ${{ inputs.line_offset }}
          INPUT_LINES_PER_PRIME: ${{ inputs.lines_per_prime }}
          INPUT_MAX_SUCCESSFUL_MOVES: ${{ inputs.max_successful_moves }}
          INPUT_MAX_ISOMETRY_CHECKS: ${{ inputs.max_isometry_checks }}
        run: |
          set -euo pipefail
          {
            echo "MODE=${INPUT_MODE:-bidirectional}"
            echo "ROUNDS=${INPUT_ROUNDS:-8}"
            echo "BEAM_SIZE=${INPUT_BEAM_SIZE:-8}"
            echo "PRIMES=${INPUT_PRIMES:-2}"
            echo "LINE_OFFSET=${INPUT_LINE_OFFSET:-0}"
            echo "LINES_PER_PRIME=${INPUT_LINES_PER_PRIME:-32}"
            echo "MAX_SUCCESSFUL_MOVES=${INPUT_MAX_SUCCESSFUL_MOVES:-10000}"
            echo "MAX_ISOMETRY_CHECKS=${INPUT_MAX_ISOMETRY_CHECKS:-20000}"
          } >> "$GITHUB_ENV"

      - name: Verify sampler and actual Sage neighbor API
        shell: bash
        run: sage -python -m unittest discover -s tests -p 'test_projective_line_sampler.py' -v

      - name: Search and preserve exact rational p-neighbor embeddings
        shell: bash
        env:
          SEARCH_CONTAINER_IMAGE: sagemath/sagemath:10.9
          SEARCH_CONTAINER_DIGEST: sha256:e068670ae5863b54b2550e72437ec637b0283acb0dc712c8584c124dbf44e667
          LINE_SELECTION: ${{ inputs.line_selection || 'hash-projective' }}
          SAMPLING_SEED: ${{ inputs.sampling_seed || 'rank32-20260908-p2-v1' }}
        run: |
          set -uo pipefail
          out=/tmp/e8-a2-target-neighbor-bridge
          log=/tmp/e8-a2-target-neighbor-bridge.run.log
          if [[ -e "$out" ]]; then
            echo "refusing pre-existing output path: $out" >&2
            exit 1
          fi
          set +e
          timeout --foreground --signal=TERM --kill-after=60s 350m \
            sage -python research/search_e8_a2_target_neighbor_bridge.py \
            --output /tmp/e8-a2-target-neighbor-bridge \
            --mode "$MODE" \
            --rounds "$ROUNDS" \
            --beam-size "$BEAM_SIZE" \
            --primes "$PRIMES" \
            --line-offset "$LINE_OFFSET" \
            --line-selection "$LINE_SELECTION" \
            --sampling-seed "$SAMPLING_SEED" \
            --max-sampling-draws-per-window 4096 \
            --lines-per-prime "$LINES_PER_PRIME" \
            --max-successful-moves "$MAX_SUCCESSFUL_MOVES" \
            --max-isometry-checks "$MAX_ISOMETRY_CHECKS" \
            | tee "$log"
          search_status=$?
          set -e
          if [[ -d "$out" ]]; then
            cp "$log" "$out/run.log"
          fi
          exit "$search_status"

      - name: Enforce evidence and claim boundaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path('/tmp/e8-a2-target-neighbor-bridge')
          record = json.loads((out / 'result.json').read_text())
          assert record['status'] in {
              'bridge_found',
              'bounded_search_completed',
              'inconclusive_isometry_budget_exhausted',
              'error',
          }, record
          assert record['termination_reason'], record
          assert record['claim_boundary']['rank31_curve_found'] is False
          assert record['claim_boundary']['rank32_curve_found'] is False
          if record['status'] != 'error':
              assert record['claim_boundary']['rational_P3_found'] is False
              assert (out / 'states.jsonl').is_file()
              assert (out / 'moves.jsonl').is_file()
          if record['status'] == 'inconclusive_isometry_budget_exhausted':
              assert record['artifact_importable'] is False
              assert record['isometry_comparisons']['budget_exhausted'] is True
              assert record['isometry_comparisons']['skipped_due_to_budget'] >= 1
          if record['status'] == 'bridge_found':
              bridge = json.loads((out / 'exact-bridge.json').read_text())
              assert bridge['all_parent_child_gram_identities_verified'] is True
              assert bridge['all_neighbor_intersection_indices_verified'] is True
              assert bridge['end_to_end_transport'][
                  'M_transpose_G_origin_initial_M_equals_G_endpoint_initial'
              ] is True
          print(record['status'], record.get('truth_status', record.get('error')))
          PY

      - name: Hash the complete bounded-search evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/e8-a2-target-neighbor-bridge
          manifest=/tmp/e8-a2-target-neighbor-bridge.SHA256SUMS
          find . -maxdepth 1 -type f \
            ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$manifest"
          mv "$manifest" SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e8-a2-target-exact-neighbor-bridge
          path: /tmp/e8-a2-target-neighbor-bridge
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
