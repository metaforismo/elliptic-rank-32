name: exact-verification

on:
  push:
    branches: [main]
    paths:
      - "curve.json"
      - "points.json"
      - "verify_exact.py"
      - "baseline/**"
      - "research/**"
      - "certificates/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "curve.json"
      - "points.json"
      - "verify_exact.py"
      - "baseline/**"
      - "research/**"
      - "certificates/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned exact-symbolic test dependencies
        run: python3 -m pip install --disable-pip-version-check "sympy==1.14.0" "mpmath==1.3.0"

      - name: Recompute the unconditional rank-29 certificate
        run: python3 verify_exact.py

      - name: Recompute rank-29 JSON from scratch
        run: |
          python3 baseline/verify_rank29_mod2.py \
            --write-certificate /tmp/rank29_mod2_certificate.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          committed = json.loads(Path("baseline/rank29_mod2_certificate.json").read_text())
          fresh = json.loads(Path("/tmp/rank29_mod2_certificate.json").read_text())
          assert committed == fresh
          print("fresh rank-29 certificate matches committed certificate")
          PY

      - name: Recompute the three-character rank-packet certificate
        run: |
          python3 research/packet3_certificate.py \
            --compare certificates/packet3_certificate.json

      - name: Recompute the one-function visibility barrier certificate
        run: |
          python3 research/riemann_roch_visibility_certificate.py \
            --compare certificates/riemann_roch_visibility_barrier.json

      - name: Recompute the N=474 Shimura anchor certificate
        run: |
          python3 research/rank17_shimura_anchor.py \
            --compare certificates/rank17_shimura_anchor.json

      - name: Recompute the rank-17 seed glue certificate
        run: |
          python3 research/rank17_seed_glue_certificate.py \
            --compare certificates/rank17_seed_glue.json

      - name: Recompute the exact split semistable seed-model certificate
        run: |
          python3 research/rank17_exact_split_seed_model.py \
            --compare certificates/rank17_exact_split_seed_model.json

      - name: Recompute the local F7 rank-17 section-incidence certificate
        run: |
          python3 research/rank17_section_local_branch_f7.py \
            --compare certificates/rank17_section_local_branch_f7.json

      - name: Recompute the target-component mod-49 obstruction
        run: |
          python3 research/rank17_component_lift_obstruction_f7.py \
            --compare certificates/rank17_component_lift_obstruction_f7.json

      - name: Run exact unit tests
        run: python3 -m unittest discover -s tests -v
