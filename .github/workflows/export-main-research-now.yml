name: export-main-research-now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-main-research-now.yml"

permissions:
  contents: read

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact snapshots
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > HEAD.txt
          git archive --format=tar.gz --output=elliptic-rank-31-main.tar.gz HEAD
          git bundle create elliptic-rank-31-main.bundle --all
          sha256sum HEAD.txt elliptic-rank-31-main.tar.gz elliptic-rank-31-main.bundle > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: elliptic-rank-31-main-research-export
          path: |
            HEAD.txt
            SHA256SUMS
            elliptic-rank-31-main.tar.gz
            elliptic-rank-31-main.bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
